<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demark razvoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black header with location (BG/NS), date and role; dispatcher board of driver columns, driver stop list, manager summary.
   Palette deliberately limited to white, black, grays + green (normal / delivered) and red (urgent / problem). Single light look. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#E9E9E9; --line:#D6D6D6;
  --fg:#111111; --muted:#6A6A6A; --black:#111111; --white:#FFFFFF;
  --green:#1B7F3B; --red:#C62828; --blue:#0072CE; --deliv:#1157CC; --pick:#E77024;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
select:disabled{opacity:.5;cursor:not-allowed}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--black);color:var(--white)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:19px;line-height:1.1;font-weight:800}
.brand small{display:block;font-size:11.5px;color:#A8A8A8;font-weight:500}
.seg{display:flex;background:#2A2A2A;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#D0D0D0;padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--black)}
.seg.loc button{min-width:46px;font-weight:800;letter-spacing:.03em}
.datebar{display:flex;align-items:center;gap:4px}
.datebar button,.datebar input{background:transparent;border:1px solid #444;color:var(--white);border-radius:8px;height:34px}
.datebar button{min-width:34px;cursor:pointer}
.datebar input{padding:0 8px;color-scheme:dark}

main{max-width:1280px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--black);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--black)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn.blue:hover{background:#005FAD;border-color:#005FAD}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.bad{color:var(--red);border-color:var(--red)}
.btn.badfill{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.big{padding:12px 16px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--black)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--black)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--black)}
.chips button[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:var(--white)}
.chips button span{font-weight:500;opacity:.7;margin-left:4px}
.confirm{display:grid;gap:16px;text-align:center;padding:8px 0}
.confirm h2{font-size:22px}
.confirm .row{justify-content:center}
.confirm .btn{min-width:140px}
.ttl h2{font-size:26px;line-height:1.15}
.ttl-sub{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.loc-tag{display:inline-block;background:var(--black);color:var(--white);font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:5px;padding:2px 7px;vertical-align:middle}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip div{background:var(--surface);padding:10px 14px}
.strip b{display:block;font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted);font-weight:500}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;min-width:0}
.col-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 4px 6px}
.col-h h3{font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);padding:14px;text-align:center;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:9px;padding:10px 12px;display:grid;gap:7px;min-width:0}
.card.urgent{border-left-color:var(--red)}
.card.fin{opacity:.7}
.card-h{display:flex;gap:8px;align-items:flex-start}
.seq{flex:none;width:26px;height:26px;border-radius:50%;background:var(--black);color:var(--white);display:grid;place-items:center;font-weight:700;font-size:13px}
.card-t{min-width:0;flex:1}
.card-t b{display:block;font-weight:600;overflow-wrap:anywhere}
.card-t .meta{overflow-wrap:anywhere}
.card-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.card-f select{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);max-width:150px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.s-planned{color:var(--muted);border-color:var(--line)}
.s-en_route{color:var(--white);background:var(--black)}
.s-delivered{color:var(--green);border-color:var(--green)}
.s-failed{color:var(--red);border-color:var(--red)}
.u-urgent{background:var(--red);color:var(--white);font-weight:700;letter-spacing:.03em}
.u-normal{background:var(--green);color:var(--white)}
.t-type{gap:4px}
.t-type.deliv{background:var(--deliv);border-color:var(--deliv);color:#FFFFFF}
.t-type.pick{background:var(--pick);border-color:var(--pick);color:#FFFFFF}
.arr{width:11px;height:11px;flex:none}
.seg2 label .arr{width:14px;height:14px;margin-right:6px}
.seg2 label.deliv:has(input:checked){background:var(--deliv);border-color:var(--deliv);color:#FFFFFF}
.seg2 label.pick:has(input:checked){background:var(--pick);border-color:var(--pick);color:#FFFFFF}
.rnd{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:6px 4px 0}
.stops .rnd{font-size:12.5px;padding:8px 2px 0}
.arrows{display:flex;gap:4px;margin-left:auto}
.card-f select.sm{max-width:92px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 label{position:relative;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;font-weight:700;font-size:14px}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 label:has(input:checked){border-color:var(--black);background:var(--black);color:var(--white)}
.seg2 label:has(input:focus-visible){outline:2px solid var(--black);outline-offset:2px}
.sheet.wide{max-width:1040px}
.ptbl{border-collapse:collapse;width:100%;font-size:13px}
.ptbl th{background:var(--black);color:var(--white);border:0;padding:7px 9px}
.ptbl td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.ptbl td .a{color:var(--muted);font-size:12px}
.ptbl .hot{color:var(--red);font-weight:700;font-size:11px;display:block}
.nalog{font-size:12px;color:var(--fg);background:var(--surface-2);border-radius:5px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}

.drv-head{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-width:760px}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.stops{display:grid;gap:12px;max-width:760px;width:100%}
.stop{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:14px;display:grid;gap:10px}
.stop.urgent{border-left-color:var(--red)}
.stop.fin{opacity:.72}
.stop .seq{width:34px;height:34px;font-size:16px}
.stop h3{font-size:20px;line-height:1.2}
.stop-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f);font-size:12px}

.list{display:grid;gap:8px}
.li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.li .grow{flex:1;min-width:180px}
.selbar{display:flex;flex-wrap:nowrap;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--black);border-radius:9px;padding:8px 12px}
@media (max-width:480px){.selbar .meta{display:none}}
.ck{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.ck input,.ckbox{width:18px;height:18px;accent-color:var(--black);cursor:pointer;flex:none}
.li.sel{border-color:var(--black);background:#FAFAFA}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%;max-width:360px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:end center}
@media (min-width:640px){.overlay{place-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h2{font-size:21px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:grid;gap:5px;grid-column:span 2;min-width:0;align-content:start}
.f.h{grid-column:span 1}
@media (max-width:440px){.f.h{grid-column:span 2}}
.f > label,.f .lbl{font-size:13px;font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--black);outline:none;box-shadow:0 0 0 1px var(--black)}
.f .sub{margin-top:6px}
.hint{font-size:13px;color:var(--muted)}
.newtag{font-size:11px;font-weight:700;background:var(--black);color:var(--white);border-radius:4px;padding:1px 6px;margin-left:6px}

.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--black);border-radius:8px;max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.combo-list li{padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.combo-list li small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.combo-list li.add{font-weight:700;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:2px}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--surface-2)}
.combo-list li.none{color:var(--muted);cursor:default;background:none}

.urg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.urg label{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;font-weight:700;font-size:14px}
.urg input{position:absolute;opacity:0;pointer-events:none}
.urg label.g:has(input:checked){border-color:var(--green);background:var(--green);color:var(--white)}
.urg label.r:has(input:checked){border-color:var(--red);background:var(--red);color:var(--white)}
.urg label:has(input:focus-visible){outline:2px solid var(--black);outline-offset:2px}

.userbox{display:flex;align-items:center;gap:8px;font-size:13px;color:#D0D0D0}
.userbox button{background:transparent;border:1px solid #444;color:var(--white);border-radius:8px;height:34px;padding:0 10px;cursor:pointer;font-weight:600}
.auth{max-width:400px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.auth h2{font-size:22px}
.auth .f{grid-column:auto}
.auth .btn{width:100%;padding:11px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.err{color:var(--red);font-size:13.5px}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:var(--f);color:#111}
  #printArea h1{font-size:16pt;margin:0}
  #printArea .psub{font-size:10pt;color:#555;margin:2px 0 8px}
  #printArea table{width:100%;border-collapse:collapse;font-size:10pt}
  #printArea th{background:#111!important;color:#fff!important;text-align:left;padding:5px 7px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea td{border:1px solid #ccc;padding:5px 7px;vertical-align:top}
  #printArea tr{break-inside:avoid}
  #printArea td .a{color:#555;font-size:9pt}
  #printArea .hot{color:#C62828;font-weight:700;font-size:8.5pt;display:block}
  #printArea .pfoot{font-size:8pt;color:#777;margin-top:6px}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4l3 3.2v3.3h-7z"/><circle cx="6.5" cy="17.5" r="1.7" fill="#000"/><circle cx="17" cy="17.5" r="1.7" fill="#000"/></svg>
      <div><h1>Demark razvoz</h1><small>Transport robe kupcima</small></div>
    </div>
    <nav class="seg loc" aria-label="Lokacija">
      <button data-loc="BG" aria-pressed="true">BG</button>
      <button data-loc="NS" aria-pressed="false">NS</button>
    </nav>
    <div class="datebar">
      <button id="dPrev" aria-label="Prethodni dan">‹</button>
      <input type="date" id="dPick" aria-label="Datum">
      <button id="dNext" aria-label="Sledeći dan">›</button>
      <button id="dToday" style="padding:0 10px">Danas</button>
    </div>
    <div class="userbox" id="userbox" hidden><span id="uname"></span><button id="logout">Odjava</button></div>
    <nav class="seg" aria-label="Uloga">
      <button data-role="disp" aria-pressed="true">Pregled</button>
      <button data-role="drv" aria-pressed="false">Vozač</button>
      <button data-role="mgr" aria-pressed="false">Analitika</button>
    </nav>
  </div>
</header>
<main id="main"><div class="empty">Učitavanje podataka…</div></main>
<div id="modalRoot"></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const [y,m,d]=s.split("-").map(Number); const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return ymd(x); };
const DAYS = ["ned","pon","uto","sre","čet","pet","sub"];
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-").map(Number); const x=new Date(y,m-1,d); return DAYS[x.getDay()]+" "+d+"."+m+"."; };
const DAYS_FULL = ["Nedelja","Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota"];
const fmtLong = s => { const [y,m,d]=s.split("-").map(Number); return DAYS_FULL[new Date(y,m-1,d).getDay()]+" "+pad2(d)+"/"+pad2(m); };
const fmtTime = iso => { if(!iso) return ""; const d=new Date(iso); return pad2(d.getHours())+":"+pad2(d.getMinutes()); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm = s => String(s||"").toLowerCase().replace(/đ/g,"dj").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const lsGet = k => { try { return localStorage.getItem("dt_"+k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem("dt_"+k, v); } catch(e){} };
const STATUS = {planned:"Planirano", en_route:"U toku", delivered:"Isporučeno", failed:"Neisporučeno"};

const mapsTo = a => "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(a);
function routeLink(stops){
  const s = stops.filter(o=>o.address); if(!s.length) return null;
  const last = s[s.length-1], way = s.slice(0,-1).slice(0,9);
  let u = mapsTo(last.address);
  if(way.length) u += "&waypoints="+way.map(o=>encodeURIComponent(o.address)).join("%7C");
  return u;
}

/* --- mapping between app fields and database columns --- */
const MAP = {
  orders: {loc:"loc", date:"date", customerId:"customer_id", customer:"customer", address:"address", phone:"phone", orderNo:"order_no", note:"note",
    urgency:"urgency", type:"type", driverId:"driver_id", round:"round", seq:"seq", status:"status", deliveredAt:"delivered_at", failedAt:"failed_at",
    failReason:"fail_reason", failNote:"fail_note", createdAt:"created_at", createdBy:"created_by", updatedAt:"updated_at", updatedBy:"updated_by"},
  customers: {name:"name", addresses:"addresses", phones:"phones", createdAt:"created_at", createdBy:"created_by"},
  drivers: {name:"name", phone:"phone", loc:"loc", order:"sort"},
  profiles: {name:"full_name", role:"role", driverId:"driver_id", email:"email"}
};
const NULLABLE = new Set(["customer_id","driver_id","delivered_at","failed_at","created_at","created_by","updated_at","updated_by","role"]);
function toRow(col, obj){
  const m = MAP[col], r = {};
  for(const k in obj){ if(!(k in m)) continue; let v = obj[k]; const c = m[k]; if((v===""||v===undefined) && NULLABLE.has(c)) v = null; if(v===undefined) continue; r[c] = v; }
  return r;
}
function fromRow(col, row){
  const m = MAP[col], o = {};
  for(const k in m){ const v = row[m[k]]; if(v!==null && v!==undefined) o[k] = v; }
  return o;
}
const STORE = {orders:"orders", customers:"customers", drivers:"drivers", profiles:"users"};

function handleErr(e){
  console.error(e);
  const msg = (e && (e.message||"")) || "";
  if(e && (e.code==="42501" || /row-level security|permission/i.test(msg))) toast("Nemate dozvolu za ovu radnju.");
  else if(e && e.code==="P0001") toast(msg);
  else if(/JWT|session/i.test(msg)) toast("Sesija je istekla. Prijavite se ponovo.");
  else toast("Čuvanje nije uspelo. Proverite internet vezu i pokušajte ponovo.");
  throw e;
}
const apply = (col, id, obj) => { const st = STORE[col]; if(obj===null) delete S[st][id]; else S[st][id] = obj; render(); };
const api = {
  async put(col,id,data){
    const st = STORE[col];
    if(S[st][id]) return api.patch(col,id,data);
    const { data:rows, error } = await sb.from(col).insert({id, ...toRow(col,data)}).select();
    if(error) handleErr(error);
    if(rows && rows[0]) apply(col, id, fromRow(col, rows[0]));
  },
  async patch(col,id,data){
    const { data:rows, error } = await sb.from(col).update(toRow(col,data)).eq("id", id).select();
    if(error) handleErr(error);
    if(!rows || !rows.length) handleErr({code:"42501", message:"no rows"});
    apply(col, id, fromRow(col, rows[0]));
  },
  async del(col,id){
    const { error } = await sb.from(col).delete().eq("id", id);
    if(error) handleErr(error);
    apply(col, id, null);
  },
  async delMany(col, ids){
    for(let i=0;i<ids.length;i+=200){
      const part = ids.slice(i,i+200);
      const { error } = await sb.from(col).delete().in("id", part);
      if(error) handleErr(error);
      part.forEach(id=>delete S[STORE[col]][id]);
    }
    render();
  },
  async insertMany(col, list){
    for(let i=0;i<list.length;i+=200){
      const part = list.slice(i,i+200).map(x=>({id:x.id, ...toRow(col,x.data)}));
      const { data:rows, error } = await sb.from(col).insert(part).select();
      if(error) handleErr(error);
      (rows||[]).forEach(r=>{ S[STORE[col]][r.id] = fromRow(col,r); });
    }
    render();
  }
};
async function fetchAll(col, build){
  const out = {}; let from = 0;
  for(;;){
    let q = sb.from(col).select("*").range(from, from+999);
    if(build) q = build(q);
    const { data, error } = await q;
    if(error) throw error;
    data.forEach(r=>{ out[r.id] = fromRow(col, r); });
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}

    (S.dispTab==="plan" ? dispPlan() : S.dispTab==="cust" ? dispCustomers() : S.dispTab==="drivers" ? dispDrivers() : dispUsers());

function dispPlan(){

  let h = `<div class="row"><div class="ttl"><h2>${esc(LOCS[S.loc])}</h2><div class="ttl-sub">${esc(fmtLong(S.date))}${S.date===today()?` <span class="meta">· danas</span>`:""}</div></div><span class="spacer"></span>
    <button class="btn" data-act="print">Štampa</button>${P.add()?`<button class="btn blue" data-act="new-order" ${D()}>+ Dodaj na razvoz</button>`:""}</div>

    <div><span>Raspoređeno</span><b>${assigned}<small class="meta" style="font-size:15px"> / ${tot}</small></b></div>
    <div><span>Hitne isporuke</span><b style="color:${urgent?"var(--red)":"inherit"}">${urgent}</b></div>
    <div><span>Isporučeno</span><b style="color:${deliv?"var(--green)":"inherit"}">${deliv}</b></div>
    <div><span>Problemi</span><b style="color:${failed?"var(--red)":"inherit"}">${failed}</b></div>
  </div>`;
  const un = list.filter(o=>!o.driverId || !S.drivers[o.driverId] || S.drivers[o.driverId].loc!==S.loc).sort(urgFirst);
  if(S.planFilter!=="all" && S.planFilter!=="un" && !ds.some(d=>d.id===S.planFilter)) S.planFilter = "all";
  const chip = (k,l,n) => `<button data-act="pfilter" data-f="${esc(k)}" aria-pressed="${S.planFilter===k}">${esc(l)}<span>${n}</span></button>`;
  h += `<div class="chips" role="group" aria-label="Filter">${chip("all","Sve",tot)}${chip("un","Neraspoređeno",un.length)}${ds.map(d=>chip(d.id,d.name,list.filter(o=>o.driverId===d.id).length)).join("")}</div><div class="board">`;
  const showUn = S.planFilter==="all" || S.planFilter==="un";
  if(showUn){
  h += `<section class="col"><div class="col-h"><h3>Neraspoređeno</h3><span class="meta num">${un.length}</span></div>`;
  h += un.length ? un.map(o=>orderCard(o,ds,null)).join("") : `<div class="empty">${tot?"Sve porudžbine su raspoređene.":"Nema porudžbina za ovaj dan."}</div>`;
  h += `</section>`;
  }
  for(const d of ds.filter(d=>S.planFilter==="all" || S.planFilter===d.id)){
    const mine = list.filter(o=>o.driverId===d.id).sort(bySeq);
    const rl = routeLink(mine.filter(o=>!isFin(o)));
    h += `<section class="col"><div class="col-h"><h3>${esc(d.name)}</h3><span class="meta num">${mine.filter(isFin).length}/${mine.length}</span><span class="spacer"></span>${rl?`<a class="btn sm" href="${esc(rl)}" target="_blank" rel="noopener">Ruta ↗</a>`:""}</div>`;
    if(!mine.length) h += `<div class="empty">Nema stanica.</div>`;

      const r = +o.round||0, grp = mine.filter(x=>(+x.round||0)===r);

  if(!armConfirm(btn, `Potvrdi brisanje (${S.custSel.size})`)) return;
  const ids = [...S.custSel]; btn.disabled = true; let done = 0;
  try{ await api.delMany("customers", ids); ids.forEach(id=>S.custSel.delete(id)); done = ids.length; toast(`Izbrisano kupaca: ${done}`); }
  catch(e){}
  if(!Object.keys(S.customers).length) S.custEdit = false;
  render();
}

function viewDrv(){
  const ds = drivers();
  const lockD = P.myDriver();
  let h = lockD ? `<div class="drv-head"><div class="row"><b style="font-size:18px">${esc(S.drivers[lockD]?.name||"")}</b><span class="loc-tag">${S.loc}</span></div>` : `<div class="drv-head"><div class="row"><label for="meSel" style="font-weight:600">Vozač <span class="loc-tag">${S.loc}</span></label>

  const d = S.me && S.drivers[S.me] && S.drivers[S.me].loc===S.loc ? {id:S.me,...S.drivers[S.me]} : null;
  if(!d) return h + `<p class="hint" style="margin:0">Izaberite svoje ime da vidite turu za ${esc(fmtLong(S.date))}.</p></div>`;
  const mine = ordersOn(S.date).filter(o=>o.driverId===d.id).sort(bySeq);
  const done = mine.filter(o=>o.status==="delivered").length, fail = mine.filter(o=>o.status==="failed").length, n = mine.length;
  const rl = routeLink(mine.filter(o=>!isFin(o)));
  h += `<div class="row"><span><b style="font-size:26px" class="num">${done+fail}/${n}</b> <span class="meta">stanica završeno</span></span><span class="spacer"></span>${rl?`<a class="btn primary" href="${esc(rl)}" target="_blank" rel="noopener">Cela ruta u Google Maps ↗</a>`:""}</div>
    <div class="prog" aria-hidden="true"><i style="width:${n?done/n*100:0}%;background:var(--green)"></i><i style="width:${n?fail/n*100:0}%;background:var(--red)"></i></div></div>`;
  if(!n) return h + `<div class="empty" style="max-width:760px">Nema stanica za ${esc(fmtLong(S.date))}.</div>`;
  h += `<div class="stops">`;
  let lastR = null;
  mine.forEach((o,i)=>{
    const fin = isFin(o), r = +o.round||0;
    if(r!==lastR){ h += `<div class="rnd">Krug ${r}</div>`; lastR = r; }
    h += `<article class="stop ${o.urgency==="urgent"?"urgent":""} ${fin?"fin":""}">
      <div class="card-h"><span class="seq">${i+1}</span><div class="card-t"><h3>${esc(o.customer)}</h3><div class="meta" style="font-size:15px">${esc(o.address)}</div></div><div class="card-f" style="justify-content:flex-end">${typePill(o)}${urgPill(o.urgency)}</div></div>
      <dl class="kv">
        ${o.orderNo?`<dt>Broj naloga</dt><dd class="num">${esc(o.orderNo)}</dd>`:""}
        ${o.phone?`<dt>Telefon</dt><dd><span class="num" style="user-select:all">${esc(o.phone)}</span> <a class="btn sm" href="tel:${esc(o.phone.replace(/[^+\d]/g,""))}">Pozovi</a></dd>`:""}
        ${o.note?`<dt>Napomena</dt><dd>${esc(o.note)}</dd>`:""}
        ${o.createdBy?`<dt>Upisao</dt><dd>${esc(who(o.createdBy)||"…")}</dd>`:""}
        <dt>Status</dt><dd>${statusPill(o.status,o)}</dd>
        ${o.status==="delivered"?`<dt>${isPick(o)?"Preuzeto":"Isporučeno"}</dt><dd class="num">${esc(fmtDate(o.date))} u ${fmtTime(o.deliveredAt)}</dd>`:""}
        ${o.status==="failed"?`<dt>Razlog</dt><dd style="color:var(--red)">${esc(o.failReason||"")}${o.failNote?" · "+esc(o.failNote):""}</dd>`:""}
      </dl>
      <div class="stop-actions">${fin
        ? `<button class="btn big" data-act="reopen" data-id="${esc(o.id)}" ${D()}>Vrati na otvoreno</button>`
        : `<a class="btn big" href="${esc(mapsTo(o.address))}" target="_blank" rel="noopener">Navigacija ↗</a>
           ${o.status!=="en_route"?`<button class="btn big" data-act="start" data-id="${esc(o.id)}" ${D()}>Krećem</button>`:""}
           <button class="btn big ok" data-act="deliver" data-id="${esc(o.id)}" ${D()}>${isPick(o)?"Preuzeto":"Isporučeno"}</button>
           <button class="btn big bad" data-act="fail" data-id="${esc(o.id)}" ${D()}>Problem</button>`}
      </div></article>`;
  });
  return h + `</div>`;
}

/* ----- manager ----- */
function viewMgr(){
  const end = S.date, start = addDays(end, -(S.period-1));
  const all = Object.entries(S.orders).map(([id,o])=>({id,...o})).filter(o=>o.loc===S.loc && o.date>=start && o.date<=end);
  const del = all.filter(o=>o.status==="delivered"), fail = all.filter(o=>o.status==="failed");
  const closed = del.length+fail.length, rate = closed ? Math.round(del.length/closed*100) : null;
  const urg = all.filter(o=>o.urgency==="urgent");
  const per = drivers().map(d=>{ const m=all.filter(o=>o.driverId===d.id); const dd=m.filter(o=>o.status==="delivered").length; const ff=m.filter(o=>o.status==="failed").length; return {d, n:m.length, dd, ff, urg:m.filter(o=>o.urgency==="urgent").length, days:new Set(m.map(o=>o.date)).size, rate:(dd+ff)?Math.round(dd/(dd+ff)*100):null}; });
  const periods = [[1,"Dan"],[7,"7 dana"],[30,"30 dana"]];
  let h = `<div class="row"><div class="ttl"><h2>${esc(LOCS[S.loc])}</h2><div class="ttl-sub">Analitika · ${S.period===1?esc(fmtLong(end)):`${esc(fmtLong(start))} – ${esc(fmtLong(end))}`}</div></div><span class="spacer"></span>
    <div class="tabs" role="tablist" style="border:0">${periods.map(([p,l])=>`<button role="tab" data-act="period" data-p="${p}" aria-selected="${S.period===p}">${l}</button>`).join("")}</div></div>
  <div class="kpis">
    <div class="kpi"><span>Porudžbine</span><b>${all.length}</b><small>${closed} završeno</small></div>
    <div class="kpi"><span>Uspešnost isporuke</span><b style="color:${rate===null?"inherit":"var(--green)"}">${rate===null?"—":rate+"%"}</b><small>${del.length} isporučeno</small></div>
    <div class="kpi"><span>Neisporučeno</span><b style="color:${fail.length?"var(--red)":"inherit"}">${fail.length}</b><small>za ponovno planiranje</small></div>
    <div class="kpi"><span>Hitne isporuke</span><b>${urg.length}</b><small>${all.length?Math.round(urg.length/all.length*100):0}% svih porudžbina</small></div>
  </div>`;
  if(S.period>1) h += `<section class="panel chart"><div class="row"><h2>Isporuke po danu</h2><span class="spacer"></span><div class="legend"><span><i style="background:var(--green)"></i>Isporučeno</span><span><i style="background:var(--red)"></i>Neisporučeno</span><span><i style="background:#BDBDBD"></i>Otvoreno</span></div></div>${chart(start,end,all)}</section>`;
  h += `<div class="grid2"><section class="panel"><h2>Po vozaču</h2>${per.some(r=>r.n)?`<div class="tbl-wrap"><table><thead><tr><th>Vozač</th><th class="r">Dana</th><th class="r">Stanica</th><th class="r">Hitnih</th><th class="r">Isporuč.</th><th class="r">Problem</th><th class="r">Uspeh</th></tr></thead><tbody>${per.map(r=>`<tr><td>${esc(r.d.name)}</td><td class="r">${r.days}</td><td class="r">${r.n}</td><td class="r">${r.urg}</td><td class="r">${r.dd}</td><td class="r" style="${r.ff?"color:var(--red)":""}">${r.ff}</td><td class="r">${r.rate===null?"—":r.rate+"%"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nema tura u ovom periodu.</div>`}</section>
    <section class="panel"><h2>Neisporučene porudžbine</h2>${fail.length?`<div class="list">${fail.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(o=>`<div class="li"><div class="grow"><b>${esc(o.customer)}</b><div class="meta">${esc(fmtDate(o.date))} · ${esc(S.drivers[o.driverId]?.name||"—")}${o.orderNo?" · nalog "+esc(o.orderNo):""}</div></div><span class="meta" style="color:var(--red)">${esc(o.failReason||"")}</span><button class="btn sm" data-act="replan" data-id="${esc(o.id)}" ${dis(P.assign())}>Prebaci na sutra</button></div>`).join("")}</div>`:`<div class="empty">Nema neisporučenih porudžbina.</div>`}</section></div>`;
  return h;
}
function chart(start,end,all){
  const days=[]; for(let d=start; d<=end; d=addDays(d,1)) days.push(d);
  const data = days.map(d=>{const m=all.filter(o=>o.date===d); return {d, ok:m.filter(o=>o.status==="delivered").length, bad:m.filter(o=>o.status==="failed").length, open:m.filter(o=>!isFin(o)).length};});
  const max = Math.max(4, ...data.map(x=>x.ok+x.bad+x.open));
  const step = max<=10?2:max<=25?5:10, top = Math.ceil(max/step)*step;
  const W = 1000, H = 260, L = 32, B = 24, T = 8, iw = W-L-6, ih = H-B-T, bw = iw/days.length;
  const y = v => T + ih - v/top*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Broj isporuka po danu">`;
  for(let v=0; v<=top; v+=step) s += `<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#D6D6D6" stroke-width="${v?0.7:1.2}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every = days.length>14 ? 5 : 1;
  data.forEach((x,i)=>{
    const bx = L + i*bw + bw*0.2, w = bw*0.6; let base = 0;
    [["ok","#1B7F3B"],["bad","#C62828"],["open","#BDBDBD"]].forEach(([k,c])=>{ if(x[k]){ s += `<rect x="${bx}" y="${y(base+x[k])}" width="${w}" height="${y(base)-y(base+x[k])}" fill="${c}"><title>${fmtDate(x.d)}: ${x[k]}</title></rect>`; base+=x[k]; } });
    if(i%every===0 || i===days.length-1){ const [,mm,dd]=x.d.split("-").map(Number); s += `<text x="${bx+w/2}" y="${H-6}" text-anchor="middle">${dd}.${mm}.</text>`; }
  });
  return s + `</svg>`;
}

      <ul id="custList" class="combo-list" role="listbox" hidden></ul></div></div>

    <div class="f h"><label for="o_phoneSel">Kontakt telefon</label><select id="o_phoneSel"></select>
      <input id="o_phone" class="sub" type="tel" placeholder="06x xxx xxxx" aria-label="Novi telefon" hidden></div>

    <div class="f h"><label for="o_date">Datum isporuke</label><input id="o_date" type="date" value="${esc(o.date)}"></div>
    <div class="f"><span class="lbl">Hitnost isporuke</span><div class="urg" role="radiogroup" aria-label="Hitnost isporuke">
      <label class="g"><input type="radio" name="urg" value="normal" ${o.urgency!=="urgent"?"checked":""}><span>1–2 dana</span></label>
      <label class="r"><input type="radio" name="urg" value="urgent" ${o.urgency==="urgent"?"checked":""}><span>Hitno</span></label></div></div>
    <div class="f"><label for="o_note">Napomena</label><textarea id="o_note" rows="2">${esc(o.note)}</textarea></div>

   <div class="row">${id&&P.del()?`<button class="btn bad" id="oDel">Izbriši</button>`:""}<span class="spacer"></span><button class="btn" data-x>Otkaži</button><button class="btn blue" id="oSave">${id?"Sačuvaj":"Dodaj na razvoz"}</button></div>`,
  root=>{
    const inp = root.querySelector("#o_cust"), ul = root.querySelector("#custList");
    const aSel = root.querySelector("#o_addrSel"), aIn = root.querySelector("#o_addr");
    const pSel = root.querySelector("#o_phoneSel"), pIn = root.querySelector("#o_phone");
    let items = [], active = -1;

    function fillSelect(sel, input, values, addLabel, current){
      const vals = [...(values||[])];
      if(current && !vals.includes(current)) vals.unshift(current);
      sel.innerHTML = `<option value="__new">${addLabel}</option>` + vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
      sel.value = current ? current : (vals.length ? vals[0] : "__new");
      input.hidden = sel.value!=="__new";
      if(input.hidden) input.value = "";
    }
    function applyCustomer(){
      const c = st.custId ? S.customers[st.custId] : null;
      const same = id && st.custId && st.custId===o.customerId;
      root.querySelector("#custNew").hidden = !st.isNew;
      fillSelect(aSel, aIn, c?.addresses, "+ Dodaj adresu", same ? o.address : null);
      fillSelect(pSel, pIn, c?.phones, "+ Dodaj telefon", same ? o.phone : null);
    }
    function renderList(){
      const q = norm(inp.value);
      let m = customers();
      if(q) m = m.filter(c=>norm(c.name).includes(q));
      m.sort((a,b)=>{ const as=norm(a.name).startsWith(q)?0:1, bs=norm(b.name).startsWith(q)?0:1; return as-bs || a.name.localeCompare(b.name,"sr"); });
      m = m.slice(0,80);
      const typed = inp.value.trim(), exact = findCustByName(typed);
      items = [{add:true}].concat(m);
      ul.innerHTML = items.map((it,i)=> it.add
        ? `<li role="option" class="add" data-i="${i}" aria-selected="${i===active}">+ Dodaj kupca${typed&&!exact?` „${esc(typed)}“`:""}</li>`
        : `<li role="option" data-i="${i}" aria-selected="${i===active}"><span>${esc(it.name)}</span><small>${esc((it.addresses||[])[0]||"")}</small></li>`).join("")
        + (m.length||!q ? "" : `<li class="none">Nema kupca sa tim imenom u bazi</li>`);
    }
    const openL = () => { renderList(); ul.hidden=false; inp.setAttribute("aria-expanded","true"); };
    const closeL = () => { ul.hidden=true; inp.setAttribute("aria-expanded","false"); active=-1; };
    function pick(i){
      const it = items[i]; if(!it) return;
      if(it.add){
        st.custId = null; st.isNew = true;
        if(findCustByName(inp.value)) inp.value = "";
        closeL(); applyCustomer();
        if(!inp.value.trim()){ inp.placeholder = "Upišite naziv novog kupca"; inp.focus(); } else aIn.focus();
      } else {
        st.custId = it.id; st.isNew = false; inp.value = it.name; closeL(); applyCustomer();
        root.querySelector("#o_no").focus();
      }
    }
    inp.addEventListener("focus", openL);
    inp.addEventListener("click", ()=>{ if(ul.hidden) openL(); });
    inp.addEventListener("input", ()=>{
      active = -1;
      const c = st.custId ? S.customers[st.custId] : null;
      if(c && norm(c.name)!==norm(inp.value)){ st.custId=null; st.isNew=false; applyCustomer(); }
      openL();
    });
    inp.addEventListener("keydown", e=>{
      const n = items.length;
      if(e.key==="ArrowDown"){ e.preventDefault(); if(ul.hidden) openL(); active=(active+1)%n; renderList(); ul.querySelector(`[data-i="${active}"]`)?.scrollIntoView({block:"nearest"}); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); active=(active-1+n)%n; renderList(); ul.querySelector(`[data-i="${active}"]`)?.scrollIntoView({block:"nearest"}); }
      else if(e.key==="Enter"){ e.preventDefault(); if(active>=0) pick(active); else { const c=findCustByName(inp.value); if(c){ items=[{add:true},c]; pick(1);} else if(inp.value.trim()){ items=[{add:true}]; pick(0);} } }
      else if(e.key==="Escape" && !ul.hidden){ e.preventDefault(); closeL(); }
    });
    inp.addEventListener("blur", ()=>setTimeout(()=>{
      if(document.activeElement===inp) return;
      closeL();
      const typed = inp.value.trim();
      if(!st.custId && typed){ const c = findCustByName(typed); if(c){ st.custId=c.id; st.isNew=false; inp.value=c.name; applyCustomer(); } else if(!st.isNew){ st.isNew=true; applyCustomer(); } }
    },150));
    ul.addEventListener("mousedown", e=>{ e.preventDefault(); const li=e.target.closest("li[data-i]"); if(li) pick(+li.dataset.i); });
    aSel.addEventListener("change", ()=>{ aIn.hidden = aSel.value!=="__new"; if(!aIn.hidden) aIn.focus(); });
    pSel.addEventListener("change", ()=>{ pIn.hidden = pSel.value!=="__new"; if(!pIn.hidden) pIn.focus(); });
    applyCustomer();

    root.querySelector("#oSave").addEventListener("click", async()=>{
      const name = inp.value.trim();
      const address = aSel.value==="__new" ? aIn.value.trim() : aSel.value;
      const phone = pSel.value==="__new" ? pIn.value.trim() : pSel.value;
      if(!name){ toast("Unesite ili izaberite kupca."); inp.focus(); return; }
      if(!address){ toast("Unesite adresu isporuke."); (aIn.hidden?aSel:aIn).focus(); return; }
      const btn = root.querySelector("#oSave"); btn.disabled = true;
      try{
        let custId = st.custId || findCustByName(name)?.id || null, created = false;
        if(!custId){
          custId = uid(); created = true;
          await api.put("customers", custId, {name, addresses:[address], phones: phone?[phone]:[], createdBy:S.myId});
        } else {
          const c = S.customers[custId] || {};
          const addrs = [...(c.addresses||[])], phones = [...(c.phones||[])];
          let ch = false;
          if(address && !addrs.includes(address)){ addrs.push(address); ch = true; }
          if(phone && !phones.includes(phone)){ phones.push(phone); ch = true; }
          if(ch) await api.patch("customers", custId, {addresses:addrs, phones});
        }
        const driverId = o.driverId||"", date = val(root,"o_date")||S.date, now = new Date().toISOString();
        const data = Object.assign({}, o, {
          loc: o.loc || S.loc, customerId: custId, customer: name, address, phone,
          orderNo: val(root,"o_no"), date, driverId, note: val(root,"o_note"),
          urgency: root.querySelector('input[name="urg"]:checked')?.value || "normal",
          type: root.querySelector('input[name="typ"]:checked')?.value || "delivery", round: +o.round||0, updatedAt: now
        });
        if(!id){ data.createdBy = S.myId; delete data.createdAt; } delete data.updatedAt; delete data.updatedBy;
        if(P.assign() && (driverId !== (o.driverId||"") || date !== o.date || data.seq==null)) data.seq = nextSeq(date, driverId);
        if(!id) data.status = "planned";
        await api.put("orders", id||uid(), data);
        closeModal(); toast(created ? "Dodato na razvoz. Kupac je upisan u bazu." : (id ? "Izmene sačuvane" : "Dodato na razvoz"));
      }catch(e){ btn.disabled = false; }
    });
    const del = root.querySelector("#oDel");
    if(del) del.addEventListener("click", async()=>{ if(!armConfirm(del)) return; try{ await api.del("orders",id); closeModal(); toast("Porudžbina obrisana"); }catch(e){} });
    if(!id && window.matchMedia("(min-width:640px)").matches) setTimeout(()=>inp.focus(),30);
  });
}
function nextSeq(date, driverId){ const m = ordersOn(date).filter(x=>(x.driverId||"")===(driverId||"")); return m.reduce((a,x)=>Math.max(a, x.seq||0), 0)+1; }

function importForm(){
  openModal(`<h2>Uvoz kupaca iz Excel-a</h2>
    <p class="hint" style="margin:0">U Excel-u označite kolone <b>Naziv</b>, <b>Adresa</b> i <b>Telefon</b> (tim redom), kopirajte ih i nalepite ovde. Ako kupac već postoji, nova adresa ili telefon se dodaju uz postojeće.</p>
    <div class="f"><label for="imp">Podaci</label><textarea id="imp" rows="9" style="font-size:13px" placeholder="Market Lipa&#9;Bulevar oslobođenja 45, Novi Sad&#9;021 451 220"></textarea></div>
    <div id="impInfo" class="hint"></div>
    <div class="row"><span class="spacer"></span><button class="btn" data-x>Otkaži</button><button class="btn primary" id="impGo" disabled>Uvezi</button></div>`,
  root=>{
    const ta = root.querySelector("#imp"), info = root.querySelector("#impInfo"), go = root.querySelector("#impGo");
    let rows = [];
    const parse = () => {
      let raw = ta.value.split(/\r?\n/).map(l=>l.split(l.includes("\t")?"\t":";").map(s=>s.trim().replace(/^"|"$/g,""))).filter(r=>r[0]);
      if(raw.length && /^(naziv|kupac|ime)$/i.test(raw[0][0])) raw.shift();
      const map = {}; raw.forEach(r=>{ const k=norm(r[0]); (map[k] ||= {name:r[0],a:new Set(),p:new Set()}); if(r[1]) map[k].a.add(r[1]); if(r[2]) map[k].p.add(r[2]); });
      rows = Object.values(map);
      const nNew = rows.filter(r=>!findCustByName(r.name)).length;
      info.textContent = rows.length ? `Prepoznato ${rows.length} kupaca: ${nNew} novih, ${rows.length-nNew} postojećih.` : "";
      go.disabled = !rows.length;
    };
    ta.addEventListener("input", parse);
    go.addEventListener("click", async()=>{
      go.disabled = true; let done = 0; const fresh = [];
      try{
        for(const r of rows){
          const ex = findCustByName(r.name);
          if(ex){ const c=S.customers[ex.id]; const a=[...new Set([...(c.addresses||[]),...r.a])], p=[...new Set([...(c.phones||[]),...r.p])];
            if(a.length!==(c.addresses||[]).length || p.length!==(c.phones||[]).length) await api.patch("customers", ex.id, {addresses:a, phones:p}); }
          else fresh.push({id:uid(), data:{name:r.name, addresses:[...r.a], phones:[...r.p], createdBy:S.myId}});
          done++;
        }
        go.textContent = `Uvoz… ${fresh.length} novih`;
        await api.insertMany("customers", fresh);
        closeModal(); toast(`Uvezeno ${done} kupaca`);
      }catch(e){ go.disabled=false; go.textContent="Pokušaj ponovo"; }
    });
  });
}

/* ---------- print ---------- */
function printRows(){
  const ds = drivers(), list = ordersOn(S.date);
  const dIdx = id => { const i = ds.findIndex(d=>d.id===id); return i<0 ? 999 : i; };
  let rows = list;
  if(S.planFilter==="un") rows = list.filter(o=>dIdx(o.driverId)===999);
  else if(S.planFilter!=="all") rows = list.filter(o=>o.driverId===S.planFilter);
  return rows.sort((a,b)=>dIdx(a.driverId)-dIdx(b.driverId) || bySeq(a,b)).map(o=>({
    name:o.customer||"", addr:o.address||"", no:o.orderNo||"", type:TYPE[isPick(o)?"pickup":"delivery"], hot:o.urgency==="urgent",
    driver:S.drivers[o.driverId]&&S.drivers[o.driverId].loc===S.loc ? S.drivers[o.driverId].name : "—", round:String(+o.round||0), note:o.note||"", by:who(o.createdBy)||""
  }));
}
function printTitle(){
  const f = S.planFilter==="all" ? "Svi vozači" : S.planFilter==="un" ? "Neraspoređeno" : (S.drivers[S.planFilter]?.name||"");
  return `${LOCS[S.loc]} · ${fmtLong(S.date)}/${S.date.slice(0,4)} · ${f}`;
}

    </tbody></table>`;
}

/* ---------- actions ---------- */
async function swap(id, dir){
  const o = S.orders[id]; const list = ordersOn(o.date).filter(x=>x.driverId===o.driverId && (+x.round||0)===(+o.round||0)).sort(bySeq);
  const i = list.findIndex(x=>x.id===id), j = i+dir; if(j<0||j>=list.length) return;
  const seqs = list.map((x,k)=>k+1); [seqs[i],seqs[j]]=[seqs[j],seqs[i]];
  try{ for(let k=0;k<list.length;k++){ if(list[k].seq!==seqs[k]) await api.patch("orders", list[k].id, {seq:seqs[k]}); } }catch(e){}
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT" || b.tagName==="INPUT") return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a==="dtab"){ S.dispTab=b.dataset.tab; render(); }
  else if(a==="cedit-on"){ S.custEdit=true; S.custSel.clear(); render(); }
  else if(a==="cedit-off"){ S.custEdit=false; S.custSel.clear(); render(); }

  else if(a==="viewas-off"){ S.viewAs=""; S.view="disp"; S.dispTab="users"; render(); }
  else if(a==="amode"){ S.authMode=b.dataset.m; S.authMsg=""; render(); }
  else if(a==="pfilter"){ S.planFilter=b.dataset.f; render(); }
  else if(a==="period"){ S.period=+b.dataset.p; render(); }

  else if(a==="edit-driver") driverForm(id);
  else if(a==="up") swap(id,-1);
  else if(a==="down") swap(id,1);
  else if(a==="deliver") deliverForm(id);
  else if(a==="fail") failForm(id);
  else if(a==="start"){ try{ await api.patch("orders",id,{status:"en_route"}); }catch(e){} }
  else if(a==="reopen"){ try{ await api.patch("orders",id,{status:"planned",deliveredAt:"",failReason:"",failNote:""}); }catch(e){} }
  else if(a==="replan"){ const o=S.orders[id]; const nd=addDays(o.date,1); try{ await api.patch("orders",id,{date:nd,status:"planned",failReason:"",failNote:"",seq:nextSeq(nd,o.driverId)}); toast("Prebačeno na "+fmtDate(nd)); }catch(e){} }

/* ---------- auth ---------- */
document.addEventListener("submit", async e=>{
  if(e.target.id!=="authForm") return;
  e.preventDefault();
  const email = $("#a_email")?.value.trim(), pass = $("#a_pass")?.value || "", name = $("#a_name")?.value.trim();
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  try{
    if(S.authMode==="register"){
      if(!name || !email || pass.length<8){ S.authMsg = "!Unesite ime, email i lozinku od najmanje 8 znakova."; render(); return; }
      const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ full_name:name }, emailRedirectTo: location.origin+location.pathname } });
      if(error) throw error;
      if(!data.session){ S.authMode = "login"; S.authMsg = "Poslali smo vam email za potvrdu. Kliknite na link iz poruke, pa se prijavite."; render(); }
    } else if(S.authMode==="reset"){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin+location.pathname });
      if(error) throw error;
      S.authMode = "login"; S.authMsg = "Ako nalog postoji, poslali smo link za novu lozinku na email."; render();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error) throw error;
    }
  }catch(err){
    const m = err.message||"";
    S.authMsg = "!" + (/Invalid login/i.test(m) ? "Pogrešan email ili lozinka." : /not confirmed/i.test(m) ? "Email još nije potvrđen. Proverite poštu." : /registered/i.test(m) ? "Nalog sa tim emailom već postoji." : "Greška: "+m);
    render();
  }finally{ if(btn.isConnected) btn.disabled = false; }
});

let channel = null;
async function loadAll(){
  S.loaded = {orders:false,drivers:false,customers:false,users:false};
  S.mode = "loading"; render();
  try{
    const [users, drv] = await Promise.all([fetchAll("profiles"), fetchAll("drivers")]);
    S.users = users; S.drivers = drv; S.loaded.users = S.loaded.drivers = true;
    S.role = S.users[S.myId]?.role || null;
    if(S.role && S.role!=="vozac"){ S.customers = await fetchAll("customers"); }
    S.loaded.customers = true;
    if(S.role){ S.orders = await fetchAll("orders", q=>q.gte("date", addDays(today(), -120))); }
    S.loaded.orders = true;
  }catch(err){ console.error(err); toast("Podaci nisu učitani. Osvežite stranicu."); }
  S.mode = "db"; render();
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("razvoz");
  ["orders","customers","drivers","profiles"].forEach(col=>{
    channel.on("postgres_changes", {event:"*", schema:"public", table:col}, p=>{
      const st = STORE[col];
      if(p.eventType==="DELETE"){ delete S[st][p.old.id]; }
      else { S[st][p.new.id] = fromRow(col, p.new); }
      if(col==="profiles" && (p.new?.id===S.myId)){ const before = S.role; S.role = S.users[S.myId]?.role || null; if(before!==S.role){ loadAll(); return; } }
      render();
    });
  });
  channel.subscribe();
}
async function onSession(sess){
  const prev = session?.user?.id;
  session = sess;
  if(!session){ S.myId = null; S.role = null; S.mode = "auth"; S.orders = {}; S.customers = {}; S.users = {}; if(channel){ sb.removeChannel(channel); channel = null; } render(); return; }
  S.myId = session.user.id;
  if(prev !== S.myId) await loadAll();
}

/* ---------- boot ---------- */
(async()=>{
  if(!window.supabase || SUPABASE_URL.includes("VAS-PROJEKAT") || SUPABASE_ANON_KEY.includes("VAS-ANON")){ S.mode = "config"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event==="PASSWORD_RECOVERY"){ setTimeout(()=>newPasswordForm(),0); }
    if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="INITIAL_SESSION") setTimeout(()=>onSession(sess),0);
  });
})();
function newPasswordForm(){
  openModal(`<h2>Nova lozinka</h2><form class="form" id="npf" novalidate><div class="f"><label for="np">Nova lozinka (najmanje 8 znakova)</label><input id="np" type="password" autocomplete="new-password"></div></form>
    <div class="row"><span class="spacer"></span><button class="btn blue" id="npSave">Sačuvaj lozinku</button></div>`, root=>{
    root.querySelector("#npSave").addEventListener("click", async()=>{
      const pw = root.querySelector("#np").value; if(pw.length<8){ toast("Lozinka mora imati najmanje 8 znakova."); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if(error) toast("Lozinka nije promenjena: "+error.message); else { closeModal(); toast("Lozinka je promenjena."); }
    });
  });
}
})();
</script>
