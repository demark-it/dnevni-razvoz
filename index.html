<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demark razvoz</title>
<meta name="app-version" content="1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black header with location (BG/NS), date and role; dispatcher board of driver columns, driver stop list, manager summary.
   Palette deliberately limited to white, black, grays + green (normal / delivered) and red (urgent / problem). Single light look. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface-2:#E9E9E9; --line:#D6D6D6;
  --fg:#111111; --muted:#6A6A6A; --black:#111111; --white:#FFFFFF;
  --green:#1B7F3B; --red:#C62828; --blue:#0072CE; --deliv:#1157CC; --pick:#E77024;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
select:disabled{opacity:.5;cursor:not-allowed}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}

/* Header: black brand bar, dark nav bar, thin blue rules (per client mockup) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:var(--white)}
.bar1{background:#111111}
.bar2{background:#2B2B2B;position:relative}
.in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar2 .in{padding:14px 16px}
.brand{margin-right:auto;min-width:0}
.brand h1{font-size:19px;line-height:1.15;font-weight:800}
.brand small{display:block;font-size:11.5px;color:#A8A8A8;font-weight:500}
.userbox{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--white)}
.hbtn{background:transparent;border:1px solid #5A5A5A;color:var(--white);border-radius:8px;height:34px;min-width:34px;display:inline-grid;place-items:center;cursor:pointer;padding:0 8px}
.hbtn:hover{border-color:#9A9A9A}
.hbtn svg{width:18px;height:18px}
.mainnav{display:flex;gap:2px;align-items:center;min-width:0}
.mainnav button{background:none;border:0;color:#CFCFCF;font-weight:500;font-size:15px;padding:6px 8px;cursor:pointer;white-space:nowrap;border-radius:6px}
.mainnav button:hover{color:var(--white)}
.mainnav button[aria-current="page"]{color:var(--white);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.menubtn{display:none}
.datebar{display:flex;align-items:center;gap:6px;margin-left:auto}
.datebar button,.datebar input{background:transparent;border:1px solid #5A5A5A;color:var(--white);border-radius:8px;height:34px}
.datebar button{min-width:34px;cursor:pointer;display:grid;place-items:center}
.datebar button svg{width:16px;height:16px}
.datebar input{padding:0 10px;color-scheme:dark;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .menubtn{display:inline-grid}
  .mainnav{display:none;position:absolute;left:0;right:0;top:100%;background:#2B2B2B;flex-direction:column;align-items:stretch;padding:6px 10px 10px;gap:0}
  .mainnav.open{display:flex}
  .mainnav button{text-align:left;padding:11px 8px;font-size:16px}
}

main{max-width:1280px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--black);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--black)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn.blue:hover{background:#005FAD;border-color:#005FAD}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.bad{color:var(--red);border-color:var(--red)}
.btn.badfill{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.big{padding:12px 16px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--black)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--black)}
.chipbar{display:flex;align-items:center;gap:12px;min-width:0}
.chipwrap{flex:1;min-width:0}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap}
.chips.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.chips.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px);mask-image:linear-gradient(to right,transparent,#000 48px)}
.chips.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
@media (hover:hover) and (pointer:fine){.chips{cursor:grab}}
.chips.dragging,.chips.dragging button{cursor:grabbing;user-select:none}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--black)}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.chips button span{font-weight:500;opacity:.7;margin-left:4px}
.confirm{display:grid;gap:16px;text-align:center;padding:8px 0}
.confirm h2{font-size:22px}
.confirm .row{justify-content:center}
.confirm .btn{min-width:140px}
.ttl{display:flex;align-items:baseline;gap:12px;position:relative;min-width:0}
.ttl h2{font-size:26px;line-height:1.15}
.ttl-sub{font-size:16px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.locbtn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px 4px 2px 0;cursor:pointer;color:var(--fg)}
.locbtn svg{width:18px;height:18px;flex:none;align-self:center}
.locmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:15;background:var(--surface);border:1px solid var(--black);border-radius:10px;padding:4px;min-width:200px;box-shadow:0 10px 28px rgba(0,0,0,.16);display:grid}
.locmenu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:7px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.locmenu button:hover,.locmenu button[aria-checked="true"]{background:var(--surface-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn.ibtn{padding:8px 14px}
@media (max-width:760px){
  .ttl-sub{display:none}
  .btn.ibtn{width:42px;height:42px;padding:0}
  .btn.ibtn .lbl{display:none}
}
.viewseg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.viewseg button{border:0;background:none;width:38px;height:32px;border-radius:99px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.viewseg button svg{width:18px;height:18px}
.rlab{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.rsel{font-size:13px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--fg);min-width:58px}
.rlab.big{font-size:15px;color:var(--fg)}
.rlab.big .rsel{font-size:15px;padding:8px 10px;min-width:76px}
.card-f select.sm{max-width:80px}
.viewseg button[aria-pressed="true"]{background:var(--black);color:var(--white)}
.card.simple{gap:6px;cursor:pointer;padding:9px 12px}
.card.simple:hover{border-color:#9A9A9A}
.card.simple .card-t b{font-size:15px}
.card .collapse{justify-self:end}
.assignee{font-size:13px;color:var(--muted)}
.assignee b{color:var(--fg);font-weight:600}
.loc-tag{display:inline-block;background:var(--black);color:var(--white);font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:5px;padding:2px 7px;vertical-align:middle}

.strip{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip div{background:var(--surface);padding:10px 14px;flex:1 0 140px}
@media (hover:hover) and (pointer:fine){.strip{cursor:grab}}
.strip.dragging{cursor:grabbing;user-select:none}
.strip b{display:block;font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted);font-weight:500}

.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:#BDBDBD transparent}
.board::-webkit-scrollbar{height:10px}
.board::-webkit-scrollbar-thumb{background:#BDBDBD;border-radius:99px}
.board::-webkit-scrollbar-track{background:transparent}
.board > .col{flex:0 0 300px;scroll-snap-align:start}
@media (hover:hover) and (pointer:fine){.board{cursor:grab}.board .card,.board select,.board button{cursor:auto}.board button,.board select{cursor:pointer}.board .card.simple{cursor:pointer}}
.board.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}.board.dragging *{cursor:grabbing!important}
@media (max-width:760px){.board{margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;scroll-snap-type:x mandatory}.board > .col{flex-basis:84%}}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;min-width:0}
.col-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 4px 6px}
.col-h h3{font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);padding:14px;text-align:center;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:9px;padding:10px 12px;display:grid;gap:7px;min-width:0}
.card.urgent{border-left-color:var(--red)}
.card.fin{opacity:.7}
.card-h{display:flex;gap:8px;align-items:flex-start}
.seq{flex:none;width:26px;height:26px;border-radius:50%;background:var(--black);color:var(--white);display:grid;place-items:center;font-weight:700;font-size:13px}
.card-t{min-width:0;flex:1}
.card-t b{display:block;font-weight:600;overflow-wrap:anywhere}
.card-t .meta{overflow-wrap:anywhere}
.card-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.card-f select{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);max-width:150px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.s-planned{color:var(--muted);border-color:var(--line)}
.s-en_route{color:var(--white);background:var(--black)}
.s-delivered{color:var(--green);border-color:var(--green)}
.s-failed{color:var(--red);border-color:var(--red)}
.u-urgent{background:var(--red);color:var(--white);font-weight:700;letter-spacing:.03em}
.u-normal{background:var(--green);color:var(--white)}
.t-type{gap:4px}
.t-type.deliv{background:var(--deliv);border-color:var(--deliv);color:#FFFFFF}
.t-type.pick{background:var(--pick);border-color:var(--pick);color:#FFFFFF}
.arr{width:11px;height:11px;flex:none}
.seg2 label .arr{width:14px;height:14px;margin-right:6px}
.seg2 label.deliv:has(input:checked){background:var(--deliv);border-color:var(--deliv);color:#FFFFFF}
.seg2 label.pick:has(input:checked){background:var(--pick);border-color:var(--pick);color:#FFFFFF}
.rnd{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:6px 4px 0}
.stops .rnd{font-size:12.5px;padding:8px 2px 0}
.arrows{display:flex;gap:4px;margin-left:auto}
.card-f select.sm{max-width:92px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 label{position:relative;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;font-weight:700;font-size:14px}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 label:has(input:checked){border-color:var(--black);background:var(--black);color:var(--white)}
.seg2 label:has(input:focus-visible){outline:2px solid var(--black);outline-offset:2px}
.sheet.wide{max-width:1040px}
.ptbl{border-collapse:collapse;width:100%;font-size:13px}
.ptbl th{background:var(--black);color:var(--white);border:0;padding:7px 9px}
.ptbl td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.ptbl td .a{color:var(--muted);font-size:12px}
.ptbl .hot{color:var(--red);font-weight:700;font-size:11px;display:block}
.nalog{font-size:12px;color:var(--fg);background:var(--surface-2);border-radius:5px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}

.drv-head{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-width:760px}
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.stops{display:grid;gap:12px;max-width:760px;width:100%}
.stop{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:14px;display:grid;gap:10px}
.stop.urgent{border-left-color:var(--red)}
.stop.fin{opacity:.72}
.stop .seq{width:34px;height:34px;font-size:16px}
.stop h3{font-size:20px;line-height:1.2}
.stop-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f);font-size:12px}

.list{display:grid;gap:8px}
.li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.li .grow{flex:1;min-width:180px}
.selbar{display:flex;flex-wrap:nowrap;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--black);border-radius:9px;padding:8px 12px}
@media (max-width:480px){.selbar .meta{display:none}}
.ck{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.ck input,.ckbox{width:18px;height:18px;accent-color:var(--black);cursor:pointer;flex:none}
.li.sel{border-color:var(--black);background:#FAFAFA}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%;max-width:360px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:end center}
@media (min-width:640px){.overlay{place-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h2{font-size:21px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:grid;gap:5px;grid-column:span 2;min-width:0;align-content:start}
.f.h{grid-column:span 1}
@media (max-width:440px){.f.h{grid-column:span 2}}
.f > label,.f .lbl{font-size:13px;font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--black);outline:none;box-shadow:0 0 0 1px var(--black)}
.f .sub{margin-top:6px}
.hint{font-size:13px;color:var(--muted)}
.newtag{font-size:11px;font-weight:700;background:var(--black);color:var(--white);border-radius:4px;padding:1px 6px;margin-left:6px}

.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--black);border-radius:8px;max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.combo-list li{padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.combo-list li small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.combo-list li.add{font-weight:700;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:2px}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--surface-2)}
.combo-list li.none{color:var(--muted);cursor:default;background:none}

.urg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.urg label{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;font-weight:700;font-size:14px}
.urg input{position:absolute;opacity:0;pointer-events:none}
.urg label.g:has(input:checked){border-color:var(--green);background:var(--green);color:var(--white)}
.urg label.r:has(input:checked){border-color:var(--red);background:var(--red);color:var(--white)}
.urg label:has(input:focus-visible){outline:2px solid var(--black);outline-offset:2px}


.auth{max-width:400px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.auth h2{font-size:22px}
.auth .f{grid-column:auto}
.auth .btn{width:100%;padding:11px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.err{color:var(--red);font-size:13.5px}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:var(--f);color:#111}

/* --- mapping between app fields and database columns --- */
const MAP = {
  orders: {loc:"loc", date:"date", customerId:"customer_id", customer:"customer", address:"address", phone:"phone", orderNo:"order_no", note:"note",
    urgency:"urgency", type:"type", driverId:"driver_id", round:"round", seq:"seq", status:"status", deliveredAt:"delivered_at", failedAt:"failed_at",

};
const NULLABLE = new Set(["customer_id","driver_id","delivered_at","failed_at","created_at","created_by","updated_at","updated_by","role"]);
function toRow(col, obj){
  const m = MAP[col], r = {};
  for(const k in obj){ if(!(k in m)) continue; let v = obj[k]; const c = m[k]; if((v===""||v===undefined) && NULLABLE.has(c)) v = null; if(v===undefined) continue; r[c] = v; }
  return r;
}
function fromRow(col, row){
  const m = MAP[col], o = {};
  for(const k in m){ const v = row[m[k]]; if(v!==null && v!==undefined) o[k] = v; }
  return o;
}
const STORE = {orders:"orders", customers:"customers", drivers:"drivers", profiles:"users"};

function handleErr(e){
  console.error(e);
  const msg = (e && (e.message||"")) || "";
  if(e && (e.code==="42501" || /row-level security|permission/i.test(msg))) toast("Nemate dozvolu za ovu radnju.");
  else if(e && e.code==="P0001") toast(msg);
  else if(/JWT|session/i.test(msg)) toast("Sesija je istekla. Prijavite se ponovo.");
  else toast("Čuvanje nije uspelo. Proverite internet vezu i pokušajte ponovo.");
  throw e;
}
const apply = (col, id, obj) => { const st = STORE[col]; if(obj===null) delete S[st][id]; else S[st][id] = obj; render(); };
const api = {
  async put(col,id,data){
    const st = STORE[col];
    if(S[st][id]) return api.patch(col,id,data);
    const { data:rows, error } = await sb.from(col).insert({id, ...toRow(col,data)}).select();
    if(error) handleErr(error);
    if(rows && rows[0]) apply(col, id, fromRow(col, rows[0]));
  },
  async patch(col,id,data){
    const { data:rows, error } = await sb.from(col).update(toRow(col,data)).eq("id", id).select();
    if(error) handleErr(error);
    if(!rows || !rows.length) handleErr({code:"42501", message:"no rows"});
    apply(col, id, fromRow(col, rows[0]));
  },
  async del(col,id){
    const { error } = await sb.from(col).delete().eq("id", id);
    if(error) handleErr(error);
    apply(col, id, null);
  },
  async delMany(col, ids){
    for(let i=0;i<ids.length;i+=200){
      const part = ids.slice(i,i+200);
      const { error } = await sb.from(col).delete().in("id", part);
      if(error) handleErr(error);
      part.forEach(id=>delete S[STORE[col]][id]);
    }
    render();
  },
  async insertMany(col, list){
    for(let i=0;i<list.length;i+=200){
      const part = list.slice(i,i+200).map(x=>({id:x.id, ...toRow(col,x.data)}));
      const { data:rows, error } = await sb.from(col).insert(part).select();
      if(error) handleErr(error);
      (rows||[]).forEach(r=>{ S[STORE[col]][r.id] = fromRow(col,r); });
    }
    render();
  }
};
async function fetchAll(col, build){
  const out = {}; let from = 0;
  for(;;){
    let q = sb.from(col).select("*").range(from, from+999);
    if(build) q = build(q);
    const { data, error } = await q;
    if(error) throw error;
    data.forEach(r=>{ out[r.id] = fromRow(col, r); });
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}

  const list = ordersOn(S.date), ds = drivers();
  const tot = list.length, assigned = list.filter(o=>o.driverId && S.drivers[o.driverId]).length;

  h += `<div class="chipbar"><div class="chipwrap"><div class="chips" role="group" aria-label="Filter">${chip("all","Sve",tot)}${chip("un","Neraspoređeno",un.length)}${ds.map(d=>chip(d.id,d.name,list.filter(o=>o.driverId===d.id).length)).join("")}</div></div>

  const showUn = S.planFilter==="all" || S.planFilter==="un";
  if(showUn){
  h += `<section class="col"><div class="col-h"><h3>Neraspoređeno</h3><span class="meta num">${un.length}</span></div>`;

  h += `</section>`;
  }
  for(const d of ds.filter(d=>S.planFilter==="all" || S.planFilter===d.id)){
    const all = list.filter(o=>o.driverId===d.id).sort(bySeq);
    const cr = S.colRound[d.id] || "";
    const mine = cr==="" ? all : all.filter(o=>String(+o.round||0)===cr);
    h += `<section class="col"><div class="col-h"><h3>${esc(d.name)}</h3><span class="meta num">${mine.filter(isFin).length}/${mine.length}</span>${all.length?roundSelect("colround", d.id, cr, all):""}</div>`;
    if(!mine.length) h += `<div class="empty">${all.length?"Nema stanica u ovom krugu.":"Nema stanica."}</div>`;
    let lastR = null;
    mine.forEach(o=>{
      const r = +o.round||0, grp = all.filter(x=>(+x.round||0)===r);
      if(r!==lastR){ h += `<div class="rnd">${rndLabel(r)}</div>`; lastR = r; }
      h += orderCard(o,ds,all.indexOf(o)+1,grp[0].id===o.id,grp[grp.length-1].id===o.id);
    });
    h += `</section>`;
  }
  return h + `</div>`;
}

/* ----- manager ----- */
function viewMgr(){
  const end = S.date, start = addDays(end, -(S.period-1));
  const all = Object.entries(S.orders).map(([id,o])=>({id,...o})).filter(o=>o.loc===S.loc && o.date>=start && o.date<=end);
  const del = all.filter(o=>o.status==="delivered"), fail = all.filter(o=>o.status==="failed");
  const closed = del.length+fail.length, rate = closed ? Math.round(del.length/closed*100) : null;
  const urg = all.filter(o=>o.urgency==="urgent");
  const per = drivers().map(d=>{ const m=all.filter(o=>o.driverId===d.id); const dd=m.filter(o=>o.status==="delivered").length; const ff=m.filter(o=>o.status==="failed").length; return {d, n:m.length, dd, ff, urg:m.filter(o=>o.urgency==="urgent").length, days:new Set(m.map(o=>o.date)).size, rate:(dd+ff)?Math.round(dd/(dd+ff)*100):null}; });
  const periods = [[1,"Dan"],[7,"7 dana"],[30,"30 dana"]];
  let h = `<div class="row">${locTitle("Analitika · "+(S.period===1?fmtLong(end):fmtLong(start)+" – "+fmtLong(end)))}<span class="spacer"></span>
    <div class="tabs" role="tablist" style="border:0">${periods.map(([p,l])=>`<button role="tab" data-act="period" data-p="${p}" aria-selected="${S.period===p}">${l}</button>`).join("")}</div></div>
  <div class="kpis">
    <div class="kpi"><span>Isporuke</span><b>${all.length}</b><small>${closed} završeno</small></div>
    <div class="kpi"><span>Uspešnost isporuke</span><b style="color:${rate===null?"inherit":"var(--green)"}">${rate===null?"—":rate+"%"}</b><small>${del.length} isporučeno</small></div>
    <div class="kpi"><span>Neisporučeno</span><b style="color:${fail.length?"var(--red)":"inherit"}">${fail.length}</b><small>za ponovno planiranje</small></div>
    <div class="kpi"><span>Hitne isporuke</span><b>${urg.length}</b><small>${all.length?Math.round(urg.length/all.length*100):0}% svih porudžbina</small></div>
  </div>`;
  if(S.period>1) h += `<section class="panel chart"><div class="row"><h2>Isporuke po danu</h2><span class="spacer"></span><div class="legend"><span><i style="background:var(--green)"></i>Isporučeno</span><span><i style="background:var(--red)"></i>Neisporučeno</span><span><i style="background:#BDBDBD"></i>Otvoreno</span></div></div>${chart(start,end,all)}</section>`;
  h += `<div class="grid2"><section class="panel"><h2>Po vozaču</h2>${per.some(r=>r.n)?`<div class="tbl-wrap"><table><thead><tr><th>Vozač</th><th class="r">Dana</th><th class="r">Stanica</th><th class="r">Hitnih</th><th class="r">Isporuč.</th><th class="r">Problem</th><th class="r">Uspeh</th></tr></thead><tbody>${per.map(r=>`<tr><td>${esc(r.d.name)}</td><td class="r">${r.days}</td><td class="r">${r.n}</td><td class="r">${r.urg}</td><td class="r">${r.dd}</td><td class="r" style="${r.ff?"color:var(--red)":""}">${r.ff}</td><td class="r">${r.rate===null?"—":r.rate+"%"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nema tura u ovom periodu.</div>`}</section>
    <section class="panel"><h2>Neisporučene porudžbine</h2>${fail.length?`<div class="list">${fail.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(o=>`<div class="li"><div class="grow"><b>${esc(o.customer)}</b><div class="meta">${esc(fmtDate(o.date))} · ${esc(S.drivers[o.driverId]?.name||"—")}${o.orderNo?" · nalog "+esc(o.orderNo):""}</div></div><span class="meta" style="color:var(--red)">${esc(o.failReason||"")}</span><button class="btn sm" data-act="replan" data-id="${esc(o.id)}" ${dis(P.assign())}>Prebaci na sutra</button></div>`).join("")}</div>`:`<div class="empty">Nema neisporučenih porudžbina.</div>`}</section></div>`;
  return h;
}
function chart(start,end,all){
  const days=[]; for(let d=start; d<=end; d=addDays(d,1)) days.push(d);
  const data = days.map(d=>{const m=all.filter(o=>o.date===d); return {d, ok:m.filter(o=>o.status==="delivered").length, bad:m.filter(o=>o.status==="failed").length, open:m.filter(o=>!isFin(o)).length};});
  const max = Math.max(4, ...data.map(x=>x.ok+x.bad+x.open));
  const step = max<=10?2:max<=25?5:10, top = Math.ceil(max/step)*step;
  const W = 1000, H = 260, L = 32, B = 24, T = 8, iw = W-L-6, ih = H-B-T, bw = iw/days.length;
  const y = v => T + ih - v/top*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Broj isporuka po danu">`;
  for(let v=0; v<=top; v+=step) s += `<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#D6D6D6" stroke-width="${v?0.7:1.2}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every = days.length>14 ? 5 : 1;
  data.forEach((x,i)=>{
    const bx = L + i*bw + bw*0.2, w = bw*0.6; let base = 0;
    [["ok","#1B7F3B"],["bad","#C62828"],["open","#BDBDBD"]].forEach(([k,c])=>{ if(x[k]){ s += `<rect x="${bx}" y="${y(base+x[k])}" width="${w}" height="${y(base)-y(base+x[k])}" fill="${c}"><title>${fmtDate(x.d)}: ${x[k]}</title></rect>`; base+=x[k]; } });
    if(i%every===0 || i===days.length-1){ const [,mm,dd]=x.d.split("-").map(Number); s += `<text x="${bx+w/2}" y="${H-6}" text-anchor="middle">${dd}.${mm}.</text>`; }
  });
  return s + `</svg>`;
}

          done++;
        }
        go.textContent = `Uvoz… ${fresh.length} novih`;
        await api.insertMany("customers", fresh);
        closeModal(); toast(`Uvezeno ${done} kupaca`);
      }catch(e){ go.disabled=false; go.textContent="Pokušaj ponovo"; }
    });
  });
}

/* --- drivers --- */
function driverForm(id, loc){
  const d = id ? S.drivers[id] : {loc:loc||S.loc};
  openModal(`<h2>${id?"Izmena vozača":"Novi vozač"}</h2><form class="form" id="df" novalidate>
    <div class="f"><label for="d_name">Ime</label><input id="d_name" value="${esc(d.name)}"></div>
    <div class="f h"><label for="d_phone">Telefon</label><input id="d_phone" type="tel" value="${esc(d.phone)}"></div>
    <div class="f h"><label for="d_loc">Lokacija</label><select id="d_loc"><option value="BG" ${d.loc==="BG"?"selected":""}>BG · Beograd</option><option value="NS" ${d.loc==="NS"?"selected":""}>NS · Novi Sad</option></select></div>
  </form><div class="row">${id?`<button class="btn bad" id="dDel">Izbriši</button>`:""}<span class="spacer"></span><button class="btn" data-x>Otkaži</button><button class="btn primary" id="dSave">Sačuvaj</button></div>`,
  root=>{
    root.querySelector("#dSave").addEventListener("click", async()=>{
      const name = val(root,"d_name"); if(!name){ toast("Unesite ime vozača."); return; }
      try{ await api.put("drivers", id||uid(), Object.assign({}, d, {name, phone:val(root,"d_phone"), loc:val(root,"d_loc")})); closeModal(); toast("Vozač sačuvan"); }catch(e){}
    });
    const del = root.querySelector("#dDel");
    if(del) del.addEventListener("click", async()=>{ if(!armConfirm(del)) return; try{ await api.del("drivers", id); closeModal(); toast("Vozač obrisan. Njegove porudžbine su neraspoređene."); }catch(e){} });
  });
}

/* --- delivery confirmation --- */
function deliverForm(id){
  const o = S.orders[id];
  openModal(`<div class="confirm"><h2>${isPick(o)?"Roba je preuzeta?":"Roba je isporučena?"}</h2><p class="hint" style="margin:0">${esc(o.customer)} · ${esc(o.address)}${o.orderNo?" · nalog "+esc(o.orderNo):""}</p>
    <div class="row"><button class="btn big" data-x>Otkaži</button><button class="btn big ok" id="pSave">Potvrđujem</button></div></div>`,
  root=>{
    const btn = root.querySelector("#pSave");
    btn.focus();
    btn.addEventListener("click", async()=>{
      btn.disabled = true;
      try{ await api.patch("orders", id, {status:"delivered", deliveredAt:new Date().toISOString(), failReason:"", failNote:""}); closeModal(); toast(isPick(o)?"Preuzimanje potvrđeno":"Isporuka potvrđena"); }
      catch(e){ btn.disabled = false; }
    });
  });
}
function failForm(id){
  const o = S.orders[id];
  const reasons = ["Kupac nije na adresi","Kupac odbio robu","Pogrešna adresa","Oštećena roba","Nedostaje roba u vozilu","Drugo"];
  openModal(`<h2>Isporuka nije moguća</h2><p class="hint" style="margin:0">${esc(o.customer)} · ${esc(o.address)}</p>
    <form class="form" id="ff"><div class="f"><label for="f_reason">Razlog</label><select id="f_reason">${reasons.map(r=>`<option>${r}</option>`).join("")}</select></div>
    <div class="f"><label for="f_note">Napomena</label><textarea id="f_note" rows="2"></textarea></div></form>
    <div class="row"><span class="spacer"></span><button class="btn" data-x>Otkaži</button><button class="btn badfill" id="fSave">Prijavi problem</button></div>`,
  root=>{
    root.querySelector("#fSave").addEventListener("click", async()=>{
      try{ await api.patch("orders", id, {status:"failed", failReason:val(root,"f_reason"), failNote:val(root,"f_note"), failedAt:new Date().toISOString()}); closeModal(); toast("Problem prijavljen dispečeru"); }catch(e){}
    });
  });
}

/* ---------- print ---------- */
function printRows(){
  const ds = drivers(), list = ordersOn(S.date);
  const dIdx = id => { const i = ds.findIndex(d=>d.id===id); return i<0 ? 999 : i; };
  let rows = list;
  if(S.planFilter==="un") rows = list.filter(o=>dIdx(o.driverId)===999);
  else if(S.planFilter!=="all") rows = list.filter(o=>o.driverId===S.planFilter);
  return rows.sort((a,b)=>dIdx(a.driverId)-dIdx(b.driverId) || bySeq(a,b)).map(o=>({
    name:o.customer||"", addr:o.address||"", no:o.orderNo||"", type:TYPE[isPick(o)?"pickup":"delivery"], hot:o.urgency==="urgent",
    driver:S.drivers[o.driverId]&&S.drivers[o.driverId].loc===S.loc ? S.drivers[o.driverId].name : "—", round:(+o.round||0) ? String(+o.round) : "—", note:o.note||"", by:who(o.createdBy)||""
  }));
}
function printTitle(){
  const f = S.planFilter==="all" ? "Svi vozači" : S.planFilter==="un" ? "Neraspoređeno" : (S.drivers[S.planFilter]?.name||"");
  return `${LOCS[S.loc]} · ${fmtLong(S.date)}/${S.date.slice(0,4)} · ${f}`;
}
function printTable(rows){
  return `<table class="ptbl"><thead><tr><th>Naziv kupca / Adresa</th><th>Broj naloga</th><th>Vrsta</th><th>Vozač</th><th>Krug</th><th>Napomena</th><th>Upisao</th></tr></thead><tbody>
    ${rows.length ? rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="a">${esc(r.addr)}</div></td><td class="num">${esc(r.no)}</td><td>${esc(r.type)}${r.hot?'<span class="hot">HITNO</span>':""}</td><td>${esc(r.driver)}</td><td class="num" style="text-align:center">${esc(r.round)}</td><td>${esc(r.note)}</td><td>${esc(r.by)}</td></tr>`).join("") : `<tr><td colspan="7" class="meta">Nema stavki za izabrani filter.</td></tr>`}
    </tbody></table>`;
}
function printView(){
  const rows = printRows(), title = printTitle();
  openModal(`<div class="row"><h2>Štampa razvoza</h2><span class="meta">${esc(title)} · ${rows.length} stavki</span></div>
    <div class="tbl-wrap">${printTable(rows)}</div>
    <p class="hint" style="margin:0">${window.__NO_PRINT ? "Ovo je pregled za štampu. U ovoj probnoj verziji browser ne dozvoljava štampu; u pravoj verziji dugme „Štampaj” otvara prozor za štampu (A4, položeno)." : "Štampa se na A4, položeno, prema filteru izabranom u Planu razvoza. U prozoru za štampu možete izabrati i „Sačuvaj kao PDF”."}</p>
    <div class="row"><span class="spacer"></span><button class="btn" data-x>Zatvori</button>${window.__NO_PRINT?"":`<button class="btn blue" id="prGo" ${rows.length?"":"disabled"}>Štampaj</button>`}</div>`,
  root=>{
    root.classList.add("wide");
    root.querySelector("#prGo")?.addEventListener("click", ()=>{
      const now = new Date();
      $("#printArea").innerHTML = `<h1>Demark razvoz</h1><div class="psub">${esc(title)} · stavki: ${rows.length}</div>${printTable(rows)}<div class="pfoot">Štampano ${pad2(now.getDate())}.${pad2(now.getMonth()+1)}.${now.getFullYear()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}</div>`;
      window.print();
    });
  });
}

/* ---------- actions ---------- */
async function swap(id, dir){
  const o = S.orders[id]; const list = ordersOn(o.date).filter(x=>x.driverId===o.driverId && (+x.round||0)===(+o.round||0)).sort(bySeq);
  const i = list.findIndex(x=>x.id===id), j = i+dir; if(j<0||j>=list.length) return;
  const seqs = list.map((x,k)=>k+1); [seqs[i],seqs[j]]=[seqs[j],seqs[i]];
  try{ for(let k=0;k<list.length;k++){ if(list[k].seq!==seqs[k]) await api.patch("orders", list[k].id, {seq:seqs[k]}); } }catch(e){}
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT" || b.tagName==="INPUT") return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a==="locmenu"){ S.locMenu=!S.locMenu; render(); }
  else if(a==="setloc"){ S.loc=b.dataset.loc; lsSet("loc",S.loc); S.locMenu=false; render(); }
  else if(a==="cview"){ S.cardView=b.dataset.v; lsSet("cardview",S.cardView); S.expanded.clear(); render(); }
  else if(a==="cexp"){ S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); }
  else if(a==="add-user") userForm();
  else if(a==="user-pass") passForm(id);
  else if(a==="user-del") deleteUser(b, id);
  else if(a==="cedit-on"){ S.custEdit=true; S.custSel.clear(); render(); }
  else if(a==="cedit-off"){ S.custEdit=false; S.custSel.clear(); render(); }
  else if(a==="cdel") deleteSelected(b);
  else if(a==="viewas"){ S.viewAs=b.dataset.r; S.viewAsDriver=""; S.view=VIEWS[S.viewAs][0]; render(); window.scrollTo(0,0); }
  else if(a==="viewas-off"){ S.viewAs=""; S.view="admin"; render(); }
  else if(a==="amode"){ S.authMode=b.dataset.m; S.authMsg=""; render(); }
  else if(a==="pfilter"){ S.planFilter=b.dataset.f; render(); }
  else if(a==="period"){ S.period=+b.dataset.p; render(); }
  else if(a==="new-order") orderForm(null);
  else if(a==="print") printView();
  else if(a==="edit-order") orderForm(id);
  else if(a==="add-cust") custForm(null);
  else if(a==="edit-cust") custForm(id);
  else if(a==="import") importForm();
  else if(a==="add-driver") driverForm(null, b.dataset.loc);
  else if(a==="edit-driver") driverForm(id);
  else if(a==="up") swap(id,-1);
  else if(a==="down") swap(id,1);
  else if(a==="deliver") deliverForm(id);
  else if(a==="fail") failForm(id);
  else if(a==="start"){ try{ await api.patch("orders",id,{status:"en_route"}); }catch(e){} }
  else if(a==="reopen"){ try{ await api.patch("orders",id,{status:"planned",deliveredAt:"",failReason:"",failNote:""}); }catch(e){} }
  else if(a==="replan"){ const o=S.orders[id]; const nd=addDays(o.date,1); try{ await api.patch("orders",id,{date:nd,status:"planned",failReason:"",failNote:"",seq:nextSeq(nd,o.driverId)}); toast("Prebačeno na "+fmtDate(nd)); }catch(e){} }
});
document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.dataset.act==="viewas-drv" && t.value){ S.viewAs="vozac"; S.viewAsDriver=t.value; S.view="drv"; render(); window.scrollTo(0,0); }
  if(t.dataset.act==="urole"){ const id=t.dataset.id; const data={role:t.value||""}; if(t.value!=="vozac") data.driverId="";
    try{ await api.patch("profiles", id, data); toast("Uloga sačuvana"); }catch(err){ render(); } }
  if(t.dataset.act==="udrv"){ const id=t.dataset.id; try{ await api.patch("profiles", id, {driverId:t.value}); toast("Vozač povezan"); }catch(err){ render(); } }
  if(t.dataset.act==="round"){ const o=S.orders[t.dataset.id]; const r=+t.value; const m=ordersOn(o.date).filter(x=>x.driverId===o.driverId && (+x.round||0)===r); try{ await api.patch("orders", t.dataset.id, {round:r, seq:m.reduce((a,x)=>Math.max(a,x.seq||0),0)+1}); }catch(err){} }
  if(t.dataset.act==="assign"){ const o=S.orders[t.dataset.id]; try{ await api.patch("orders", t.dataset.id, {driverId:t.value, seq:nextSeq(o.date,t.value)}); }catch(err){} }
  if(t.dataset.act==="csel"){ t.checked ? S.custSel.add(t.dataset.id) : S.custSel.delete(t.dataset.id); render(); }
  if(t.dataset.act==="csall"){ const ids = custFiltered().slice(0,300).map(c=>c.id); ids.forEach(id=> t.checked ? S.custSel.add(id) : S.custSel.delete(id)); render(); }
  if(t.dataset.act==="colround"){ S.colRound[t.dataset.id]=t.value; render(); }
  if(t.dataset.act==="drvround"){ S.drvRound=t.value; lsSet("drvround",t.value); render(); }
  if(t.dataset.act==="me"){ S.me=t.value; lsSet("me",t.value); render(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="custSearch"){ S.custQ=e.target.value; render(); } });
document.querySelectorAll("#mainnav [data-role]").forEach(b=>b.addEventListener("click",()=>{ S.view=b.dataset.role; lsSet("view",S.view); S.navOpen=false; S.locMenu=false; render(); window.scrollTo(0,0); }));
$("#menuBtn").addEventListener("click", ()=>{ S.navOpen=!S.navOpen; render(); });
document.addEventListener("click", e=>{
  if(S.locMenu && !e.target.closest(".ttl")){ S.locMenu=false; render(); }
  if(S.navOpen && !e.target.closest("#mainnav") && !e.target.closest("#menuBtn")){ S.navOpen=false; render(); }
});
$("#dPick").addEventListener("change", e=>{ if(e.target.value){ S.date=e.target.value; render(); } });
$("#dPrev").addEventListener("click", ()=>{ S.date=addDays(S.date,-1); render(); });
$("#dNext").addEventListener("click", ()=>{ S.date=addDays(S.date,1); render(); });


/* ---------- drag board with mouse ---------- */
let drag = null, dragMoved = false;
document.addEventListener("pointerdown", e=>{
  if(e.pointerType!=="mouse" || e.button!==0) return;
  const board = e.target.closest(".board, .strip, .chips"); if(!board) return;
  if(e.target.closest(board.classList.contains("chips") ? "select,input,textarea,a,label" : "select,input,textarea,button,a,label")) return;
  if(board.scrollWidth <= board.clientWidth) return;
  drag = {board, x:e.clientX, left:board.scrollLeft}; dragMoved = false;
});
document.addEventListener("pointermove", e=>{
  if(!drag) return;
  const dx = e.clientX - drag.x;
  if(!dragMoved && Math.abs(dx) < 5) return;
  if(!dragMoved){ dragMoved = true; drag.board.classList.add("dragging"); }
  drag.board.scrollLeft = drag.left - dx; e.preventDefault();
});
const endDrag = () => { if(drag){ drag.board.classList.remove("dragging"); drag = null; } };
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);
document.addEventListener("click", e=>{ if(dragMoved){ e.stopPropagation(); e.preventDefault(); dragMoved = false; } }, true);

/* ---------- auth ---------- */
document.addEventListener("submit", async e=>{
  if(e.target.id!=="authForm") return;
  e.preventDefault();
  const u = ($("#a_user")?.value || "").trim(), pass = $("#a_pass")?.value || "";
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  try{
    if(S.needsBootstrap){
      const f = $("#a_first").value.trim(), l = $("#a_last").value.trim(), un = u.toLowerCase();
      if(!f || !l || !USERNAME_RE.test(un) || pass.length<6){ S.authMsg = "!Unesite ime, prezime, korisničko ime (mala slova, brojevi, tačka) i šifru od najmanje 6 znakova."; render(); return; }
      const { error } = await sb.rpc("bootstrap_admin", {p_first:f, p_last:l, p_username:un, p_password:pass});
      if(error) throw error;
      S.needsBootstrap = false;
      await login(un, pass);
    } else {
      if(!u || !pass){ S.authMsg = "!Unesite korisničko ime i šifru."; render(); return; }
      await login(u, pass);
    }
  }catch(err){
    const m = err.message||"";
    S.authMsg = "!" + (/Invalid login|not_found/i.test(m) ? "Pogrešno korisničko ime ili šifra." : m || "Prijava nije uspela.");
    render();
  }finally{ if(btn.isConnected) btn.disabled = false; }
});
async function login(u, pass){
  let email = u;
  if(!u.includes("@")){
    const { data, error } = await sb.rpc("login_email", {p_username:u.toLowerCase()});
    if(error) throw error;
    if(!data) throw {message:"not_found"};
    email = data;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  if(error) throw error;
  S.authMsg = "";
}
$("#logout").addEventListener("click", async ()=>{ await sb.auth.signOut(); });

let channel = null;
async function loadAll(){
  S.loaded = {orders:false,drivers:false,customers:false,users:false};
  S.mode = "loading"; render();
  try{
    const [users, drv] = await Promise.all([fetchAll("profiles"), fetchAll("drivers")]);
    S.users = users; S.drivers = drv; S.loaded.users = S.loaded.drivers = true;
    S.role = S.users[S.myId]?.role || null;
    if(S.role && S.role!=="vozac"){ S.customers = await fetchAll("customers"); }
    S.loaded.customers = true;
    if(S.role){ S.orders = await fetchAll("orders", q=>q.gte("date", addDays(today(), -120))); }
    S.loaded.orders = true;
  }catch(err){ console.error(err); toast("Podaci nisu učitani. Osvežite stranicu."); }
  S.mode = "db"; render();
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("razvoz");
  ["orders","customers","drivers","profiles"].forEach(col=>{
    channel.on("postgres_changes", {event:"*", schema:"public", table:col}, p=>{
      const st = STORE[col];
      if(p.eventType==="DELETE"){ delete S[st][p.old.id]; }
      else { S[st][p.new.id] = fromRow(col, p.new); }
      if(col==="profiles" && (p.new?.id===S.myId)){ const before = S.role; S.role = S.users[S.myId]?.role || null; if(before!==S.role){ loadAll(); return; } }
      render();
    });
  });
  channel.subscribe();
}
async function onSession(sess){
  const prev = session?.user?.id;
  session = sess;
  if(!session){ try{ const r = await sb.rpc("needs_bootstrap"); S.needsBootstrap = r.data===true; }catch(e){ S.needsBootstrap = false; } S.myId = null; S.role = null; S.mode = "auth"; S.orders = {}; S.customers = {}; S.users = {}; if(channel){ sb.removeChannel(channel); channel = null; } render(); return; }
  S.myId = session.user.id;
  if(prev !== S.myId) await loadAll();
}

/* ---------- boot ---------- */
(async()=>{
  if(!window.supabase || SUPABASE_URL.includes("VAS-PROJEKAT") || SUPABASE_ANON_KEY.includes("VAS-ANON")){ S.mode = "config"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="INITIAL_SESSION") setTimeout(()=>onSession(sess),0);
  });
})();
function newPasswordForm(){
  openModal(`<h2>Nova lozinka</h2><form class="form" id="npf" novalidate><div class="f"><label for="np">Nova lozinka (najmanje 8 znakova)</label><input id="np" type="password" autocomplete="new-password"></div></form>
    <div class="row"><span class="spacer"></span><button class="btn blue" id="npSave">Sačuvaj lozinku</button></div>`, root=>{
    root.querySelector("#npSave").addEventListener("click", async()=>{
      const pw = root.querySelector("#np").value; if(pw.length<8){ toast("Lozinka mora imati najmanje 8 znakova."); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if(error) toast("Lozinka nije promenjena: "+error.message); else { closeModal(); toast("Lozinka je promenjena."); }
    });
  });
}
})();
